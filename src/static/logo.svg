<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smart Healthcare Analytics logo">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f6dff" />
      <stop offset="100%" stop-color="#66a8ff" />
    </linearGradient>
    <linearGradient id="logo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#a7f4ff" stop-opacity="0.18" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#logo-bg)" />
  <rect x="14" y="14" width="28" height="28" rx="10" fill="url(#logo-accent)" />
  <circle cx="45" cy="45" r="7" fill="#8af3ff" fill-opacity="0.42" />
</svg>
